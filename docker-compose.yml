services:
  db:
    image: postgres:16-alpine
    container_name: appmeteo_db
    restart: always
    environment:
      POSTGRES_USER: appmeteo
      POSTGRES_PASSWORD: appmeteo
      POSTGRES_DB: appmeteo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: