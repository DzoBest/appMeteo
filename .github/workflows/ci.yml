name: Python tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appmeteo
          POSTGRES_PASSWORD: appmeteo
          POSTGRES_DB: appmeteo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U appmeteo -d appmeteo"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+asyncpg://appmeteo:appmeteo@localhost:5432/appmeteo

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Lancer les tests
        run: uv run pytest