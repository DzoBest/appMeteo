[project]
name = "appmeteo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dzobest", email = "junioromaxdeparis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.142.2",
    "greenlet>=3.5.6",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
appmeteo = "appmeteo:main"

[tool.fastapi]
entrypoint = "appmeteo.main:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
